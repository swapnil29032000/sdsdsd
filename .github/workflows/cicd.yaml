name: Production Unified Pipeline (CI/CD)

on:
  push:
    branches: [ main, DEV, QA, PREPROD ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write # Required to push state file back to repo

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  BACKEND_REPO: nexgensis/nexgensis-backend
  FRONTEND_REPO: nexgensis/nexgensis-frontend

jobs:
  # 0. Path Filter: Detect where changes occurred using native Git commands
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      bootstrap: ${{ steps.check.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for directory changes & Bootstrap
        id: check
        run: |
          # 1. Path Filtering
          if git diff --name-only HEAD^1 HEAD | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only HEAD^1 HEAD | grep -q "^frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          # 2. Bootstrap Check (ECR Tag Presence)
          case "${GITHUB_REF_NAME}" in
            DEV) TAG=dev-latest ;;
            QA) TAG=qa-latest ;;
            PREPROD) TAG=preprod-latest ;;
            main) TAG=prod-latest ;;
          esac

          BOOTSTRAP=false
          # Check backend
          if ! aws ecr describe-images --repository-name ${{ env.BACKEND_REPO }} --image-ids imageTag=$TAG >/dev/null 2>&1; then
            echo "Backend tag $TAG missing in ECR. Signaling Bootstrap."
            BOOTSTRAP=true
          fi
          # Check frontend
          if ! aws ecr describe-images --repository-name ${{ env.FRONTEND_REPO }} --image-ids imageTag=$TAG >/dev/null 2>&1; then
            echo "Frontend tag $TAG missing in ECR. Signaling Bootstrap."
            BOOTSTRAP=true
          fi

          echo "bootstrap=$BOOTSTRAP" >> $GITHUB_OUTPUT

  # 1. Build & Push Stages
  build-backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.bootstrap == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set Image Tag
        run: |
          case "${GITHUB_REF_NAME}" in
            DEV) TAG=dev-latest ;;
            QA) TAG=qa-latest ;;
            PREPROD) TAG=preprod-latest ;;
            main) TAG=prod-latest ;;
          esac
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Inject Build-Time Secrets (with Fallback)
        run: |
          if [ "${GITHUB_REF_NAME}" == "main" ]; then SELECTED_SECRET="${{ secrets.BE_PROD_ENV }}"; fi
          if [ "${GITHUB_REF_NAME}" == "DEV" ]; then SELECTED_SECRET="${{ secrets.BE_DEV_ENV }}"; fi
          if [ "${GITHUB_REF_NAME}" == "QA" ]; then SELECTED_SECRET="${{ secrets.BE_QA_ENV }}"; fi
          if [ "${GITHUB_REF_NAME}" == "PREPROD" ]; then SELECTED_SECRET="${{ secrets.BE_PREPROD_ENV }}"; fi
          
          if [ -z "$SELECTED_SECRET" ] || [ "$SELECTED_SECRET" == "null" ]; then
            SELECTED_SECRET="${{ secrets.BE_DEFAULT_ENV }}"
          fi
          
          printf "%s" "$SELECTED_SECRET" > ./backend/.env

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Login & Prepare ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sync Repository
        run: aws ecr describe-repositories --repository-names ${{ env.BACKEND_REPO }} || aws ecr create-repository --repository-name ${{ env.BACKEND_REPO }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: [changes, infrastructure]
    if: (needs.changes.outputs.frontend == 'true' || needs.infrastructure.outputs.ip_changed == 'true' || needs.changes.outputs.bootstrap == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set Image Tag
        run: |
          case "${GITHUB_REF_NAME}" in
            DEV) TAG=dev-latest ;;
            QA) TAG=qa-latest ;;
            PREPROD) TAG=preprod-latest ;;
            main) TAG=prod-latest ;;
          esac
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Inject Build-Time IP & Secrets
        run: |
          if [ "${GITHUB_REF_NAME}" == "main" ]; then SELECTED_SECRET="${{ secrets.FE_PROD_ENV }}"; fi
          if [ "${GITHUB_REF_NAME}" == "DEV" ]; then SELECTED_SECRET="${{ secrets.FE_DEV_ENV }}"; fi
          if [ "${GITHUB_REF_NAME}" == "QA" ]; then SELECTED_SECRET="${{ secrets.FE_QA_ENV }}"; fi
          if [ "${GITHUB_REF_NAME}" == "PREPROD" ]; then SELECTED_SECRET="${{ secrets.FE_PREPROD_ENV }}"; fi
          
          if [ -z "$SELECTED_SECRET" ] || [ "$SELECTED_SECRET" == "null" ]; then
            SELECTED_SECRET="${{ secrets.FE_DEFAULT_ENV }}"
          fi
          
          # Use relative path for Ultimate Gateway
          echo "VITE_API_URL=/api" > ./frontend/.env
          printf "%s\n" "$SELECTED_SECRET" >> ./frontend/.env

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Login & Prepare ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sync Repository
        run: aws ecr describe-repositories --repository-names ${{ env.FRONTEND_REPO }} || aws ecr create-repository --repository-name ${{ env.FRONTEND_REPO }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Infrastructure Stage
  infrastructure:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.apply.outputs.instance_ip }}
      ip_changed: ${{ steps.apply.outputs.ip_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Git State Sync & Terraform Apply
        id: apply
        working-directory: ./terraform
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }}
          
          # Capture OLD IP for drift detection
          OLD_IP=$(grep -oP '"public_ip":\s*"\K[^"]+' terraform.tfstate || echo "none")
          echo "Last Known IP: $OLD_IP"
          
          terraform init
          terraform apply -auto-approve \
            -var="ecr_registry=${{ env.ECR_REGISTRY }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="frontend_repo_name=${{ env.FRONTEND_REPO }}" \
            -var="backend_repo_name=${{ env.BACKEND_REPO }}"
          
          NEW_IP=$(terraform output -raw instance_public_ip)
          echo "instance_ip=$NEW_IP" >> $GITHUB_OUTPUT
          
          # Signal IP Change
          if [ "$OLD_IP" != "$NEW_IP" ]; then
            echo "IP DRIFT DETECTED: $OLD_IP -> $NEW_IP"
            echo "ip_changed=true" >> $GITHUB_OUTPUT
          else
            echo "IP PERSISTENT: $NEW_IP"
            echo "ip_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if git status --short | grep -q "terraform.tfstate"; then
            git add terraform.tfstate
            git commit -m "chore: update terraform state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  # 4. Deployment Stage
  deploy:
    needs: [infrastructure, build-backend, build-frontend]
    if: always() && needs.infrastructure.result == 'success'
    runs-on: ubuntu-latest
    env:
      BE_SECRET: ${{ secrets.BE_PROD_ENV || secrets.BE_DEFAULT_ENV }} # Simplify secret selection
      TAG: ${{ github.ref_name == 'main' && 'prod-latest' || github.ref_name == 'DEV' && 'dev-latest' || github.ref_name == 'QA' && 'qa-latest' || 'preprod-latest' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Orchestrate SSM Deployment
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=ip-address,Values=${{ needs.infrastructure.outputs.instance_ip }}" --query "Reservations[*].Instances[*].InstanceId" --output text)
          echo "Target Instance: $INSTANCE_ID"

          # Wait for SSM Agent
          for i in {1..15}; do
            STATUS=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" --query "InstanceInformationList[0].PingStatus" --output text)
            [ "$STATUS" == "Online" ] && break
            sleep 10
          done

          # Encode configurations for safe transmission
          ENCODED_SECRET=$(echo "${BE_SECRET}" | base64 -w 0)
          ENCODED_NGINX=$(base64 -w 0 < nginx.conf)
          ENCODED_COMPOSE=$(base64 -w 0 < docker-compose.yml)
          
          # Write deployment script to temp file to avoid heredoc issues
          cat > /tmp/deploy.sh << 'SCRIPT_END'
          set -e
          mkdir -p /home/ubuntu
          
          # Decode and write backend secret
          echo "ENCODED_SECRET_PLACEHOLDER" | base64 -d > /home/ubuntu/.env
          
          # Fix ALLOWED_HOSTS for Gateway connectivity
          if ! grep -q "ALLOWED_HOSTS" /home/ubuntu/.env; then
            echo "ALLOWED_HOSTS=*" >> /home/ubuntu/.env
          else
            sed -i "s|ALLOWED_HOSTS=.*|ALLOWED_HOSTS=*|" /home/ubuntu/.env
          fi
          
          # Deploy nginx.conf from repository
          echo "ENCODED_NGINX_PLACEHOLDER" | base64 -d > /home/ubuntu/nginx.conf
          
          # Deploy docker-compose.yml from repository
          echo "ENCODED_COMPOSE_PLACEHOLDER" | base64 -d > /home/ubuntu/docker-compose.yml
          
          # Production Patching: Replace build contexts with ECR images
          sed -i '/build:/,+2d' /home/ubuntu/docker-compose.yml
          sed -i 's|container_name: nexgensis-backend|image: ECR_REGISTRY_PLACEHOLDER/BACKEND_REPO_PLACEHOLDER:TAG_PLACEHOLDER\n      container_name: nexgensis-backend|' /home/ubuntu/docker-compose.yml
          sed -i 's|container_name: nexgensis-frontend|image: ECR_REGISTRY_PLACEHOLDER/FRONTEND_REPO_PLACEHOLDER:TAG_PLACEHOLDER\n      container_name: nexgensis-frontend|' /home/ubuntu/docker-compose.yml
          
          # Wait for cloud-init and deploy
          sudo cloud-init status --wait
          aws ecr get-login-password --region AWS_REGION_PLACEHOLDER | sudo docker login --username AWS --password-stdin ECR_REGISTRY_PLACEHOLDER
          sudo docker compose -f /home/ubuntu/docker-compose.yml pull
          sudo docker compose -f /home/ubuntu/docker-compose.yml up -d --remove-orphans
          SCRIPT_END

          # Replace placeholders with actual values
          sed -i "s|ENCODED_SECRET_PLACEHOLDER|${ENCODED_SECRET}|g" /tmp/deploy.sh
          sed -i "s|ENCODED_NGINX_PLACEHOLDER|${ENCODED_NGINX}|g" /tmp/deploy.sh
          sed -i "s|ENCODED_COMPOSE_PLACEHOLDER|${ENCODED_COMPOSE}|g" /tmp/deploy.sh
          sed -i "s|ECR_REGISTRY_PLACEHOLDER|${{ env.ECR_REGISTRY }}|g" /tmp/deploy.sh
          sed -i "s|BACKEND_REPO_PLACEHOLDER|${{ env.BACKEND_REPO }}|g" /tmp/deploy.sh
          sed -i "s|FRONTEND_REPO_PLACEHOLDER|${{ env.FRONTEND_REPO }}|g" /tmp/deploy.sh
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" /tmp/deploy.sh
          sed -i "s|AWS_REGION_PLACEHOLDER|${{ env.AWS_REGION }}|g" /tmp/deploy.sh

          # Send command via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(cat /tmp/deploy.sh | jq -Rs .)]" \
            --query "Command.CommandId" --output text)

          # Poll for completion
          echo "SSM Job Started: $COMMAND_ID"
          while true; do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].Status" --output text)
            [ "$STATUS" == "Success" ] && break
            if [[ "$STATUS" =~ (Failed|TimedOut|Cancelled) ]]; then
              echo "Error: Deployment $STATUS"
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
              exit 1
            fi
            sleep 15
          done

      - name: 🚀 DEPLOYMENT SUCCESS
        if: success()
        run: |
          IP="${{ needs.infrastructure.outputs.instance_ip }}"
          echo "=========================================================="
          echo "✨ INFRASTRUCTURE & GATEWAY READY ✨"
          echo "=========================================================="
          echo "🌍 Portal:  http://$IP"
          echo "⚙️  API:     http://$IP/api/hello/"
          echo "=========================================================="
