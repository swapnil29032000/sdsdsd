name: Production Unified Pipeline (CI/CD)

on:
  push:
    branches: [ main, DEV, QA, PREPROD ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  BACKEND_REPO: nexgensis/nexgensis-backend
  FRONTEND_REPO: nexgensis/nexgensis-frontend
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'prod-latest' || github.ref_name == 'DEV' && 'dev-latest' || github.ref_name == 'QA' && 'qa-latest' || 'preprod-latest' }}

jobs:
  # Path Filter & Bootstrap Detection
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      bootstrap: ${{ steps.check.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect Changes & Bootstrap Status
        id: check
        run: |
          # Path filtering
          git diff --name-only HEAD^1 HEAD | grep -q "^backend/" && echo "backend=true" >> $GITHUB_OUTPUT || echo "backend=false" >> $GITHUB_OUTPUT
          git diff --name-only HEAD^1 HEAD | grep -q "^frontend/" && echo "frontend=true" >> $GITHUB_OUTPUT || echo "frontend=false" >> $GITHUB_OUTPUT

          # Bootstrap check: Verify ECR tags exist
          BOOTSTRAP=false
          aws ecr describe-images --repository-name ${{ env.BACKEND_REPO }} --image-ids imageTag=${{ env.IMAGE_TAG }} >/dev/null 2>&1 || BOOTSTRAP=true
          aws ecr describe-images --repository-name ${{ env.FRONTEND_REPO }} --image-ids imageTag=${{ env.IMAGE_TAG }} >/dev/null 2>&1 || BOOTSTRAP=true
          echo "bootstrap=$BOOTSTRAP" >> $GITHUB_OUTPUT

  # Unified Build Job (Matrix Strategy)
  build:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.bootstrap == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare Environment
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          
          # Select appropriate secret based on branch and service
          if [ "${{ matrix.service }}" == "backend" ]; then
            case "${GITHUB_REF_NAME}" in
              main) SECRET="${{ secrets.BE_PROD_ENV }}" ;;
              DEV) SECRET="${{ secrets.BE_DEV_ENV }}" ;;
              QA) SECRET="${{ secrets.BE_QA_ENV }}" ;;
              PREPROD) SECRET="${{ secrets.BE_PREPROD_ENV }}" ;;
              *) SECRET="${{ secrets.BE_DEFAULT_ENV }}" ;;
            esac
            printf "%s" "$SECRET" > ${{ matrix.context }}/.env
          else
            case "${GITHUB_REF_NAME}" in
              main) SECRET="${{ secrets.FE_PROD_ENV }}" ;;
              DEV) SECRET="${{ secrets.FE_DEV_ENV }}" ;;
              QA) SECRET="${{ secrets.FE_QA_ENV }}" ;;
              PREPROD) SECRET="${{ secrets.FE_PREPROD_ENV }}" ;;
              *) SECRET="${{ secrets.FE_DEFAULT_ENV }}" ;;
            esac
            echo "VITE_API_URL=/api" > ${{ matrix.context }}/.env
            printf "%s\n" "$SECRET" >> ${{ matrix.context }}/.env
          fi

      - name: Configure AWS & ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure ECR Repository
        run: aws ecr describe-repositories --repository-names nexgensis/nexgensis-${{ matrix.service }} || aws ecr create-repository --repository-name nexgensis/nexgensis-${{ matrix.service }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/nexgensis/nexgensis-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/nexgensis/nexgensis-${{ matrix.service }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Infrastructure Provisioning
  infrastructure:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.apply.outputs.instance_ip }}
      ip_changed: ${{ steps.apply.outputs.ip_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Apply & IP Drift Detection
        id: apply
        working-directory: ./terraform
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }}
          
          OLD_IP=$(grep -oP '"public_ip":\s*"\K[^"]+' terraform.tfstate || echo "none")
          
          terraform init
          terraform apply -auto-approve \
            -var="ecr_registry=${{ env.ECR_REGISTRY }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="frontend_repo_name=${{ env.FRONTEND_REPO }}" \
            -var="backend_repo_name=${{ env.BACKEND_REPO }}"
          
          NEW_IP=$(terraform output -raw instance_public_ip)
          echo "instance_ip=$NEW_IP" >> $GITHUB_OUTPUT
          
          [ "$OLD_IP" != "$NEW_IP" ] && echo "ip_changed=true" >> $GITHUB_OUTPUT || echo "ip_changed=false" >> $GITHUB_OUTPUT
          
          git status --short | grep -q "terraform.tfstate" && {
            git add terraform.tfstate
            git commit -m "chore: update terraform state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          } || true

  # Application Deployment
  deploy:
    needs: [infrastructure, build]
    if: always() && needs.infrastructure.result == 'success'
    runs-on: ubuntu-latest
    env:
      BE_SECRET: ${{ github.ref_name == 'main' && secrets.BE_PROD_ENV || github.ref_name == 'DEV' && secrets.BE_DEV_ENV || github.ref_name == 'QA' && secrets.BE_QA_ENV || github.ref_name == 'PREPROD' && secrets.BE_PREPROD_ENV || secrets.BE_DEFAULT_ENV }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=ip-address,Values=${{ needs.infrastructure.outputs.instance_ip }}" --query "Reservations[*].Instances[*].InstanceId" --output text)

          # Wait for SSM Agent
          for i in {1..15}; do
            STATUS=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" --query "InstanceInformationList[0].PingStatus" --output text)
            [ "$STATUS" == "Online" ] && break
            sleep 10
          done

          # Encode configurations
          ENCODED_SECRET=$(echo "${BE_SECRET}" | base64 -w 0)
          ENCODED_NGINX=$(base64 -w 0 < nginx.conf)
          ENCODED_COMPOSE=$(base64 -w 0 < docker-compose.yml)
          
          FULL_SCRIPT=$(cat <<EOF
          set -e
          mkdir -p /home/ubuntu
          echo "${ENCODED_SECRET}" | base64 -d > /home/ubuntu/.env
          grep -q "ALLOWED_HOSTS" /home/ubuntu/.env && sed -i "s|ALLOWED_HOSTS=.*|ALLOWED_HOSTS=*|" /home/ubuntu/.env || echo "ALLOWED_HOSTS=*" >> /home/ubuntu/.env
          echo "${ENCODED_NGINX}" | base64 -d > /home/ubuntu/nginx.conf
          echo "${ENCODED_COMPOSE}" | base64 -d > /home/ubuntu/docker-compose.yml
          
          sed -i '/build:/,+2d' /home/ubuntu/docker-compose.yml
          sed -i 's|container_name: nexgensis-backend|image: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}\n      container_name: nexgensis-backend|' /home/ubuntu/docker-compose.yml
          sed -i 's|container_name: nexgensis-frontend|image: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}\n      container_name: nexgensis-frontend|' /home/ubuntu/docker-compose.yml

          sudo cloud-init status --wait
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          sudo docker compose -f /home/ubuntu/docker-compose.yml pull
          sudo docker compose -f /home/ubuntu/docker-compose.yml up -d --remove-orphans
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(echo "$FULL_SCRIPT" | jq -Rs .)]" \
            --query "Command.CommandId" --output text)

          # Poll for completion
          while true; do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].Status" --output text)
            [ "$STATUS" == "Success" ] && break
            [[ "$STATUS" =~ (Failed|TimedOut|Cancelled) ]] && {
              echo "Deployment $STATUS"
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
              exit 1
            }
            sleep 15
          done

      - name: 🚀 Deployment Summary
        if: success()
        run: |
          echo "=========================================="
          echo "✨ DEPLOYMENT SUCCESSFUL ✨"
          echo "=========================================="
          echo "🌍 App:  http://${{ needs.infrastructure.outputs.instance_ip }}"
          echo "⚙️  API:  http://${{ needs.infrastructure.outputs.instance_ip }}:8000/api/hello/"
          echo "=========================================="
