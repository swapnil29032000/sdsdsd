services:
  backend:
    image: $${ECR_REGISTRY}/nexgensis/nexgensis-backend:$${BACKEND_IMAGE_TAG}
    container_name: nexgensis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: $${ECR_REGISTRY}/nexgensis/nexgensis-frontend:$${FRONTEND_IMAGE_TAG}
    container_name: nexgensis-frontend
    ports:
      - "80:5173" # Mapped to Port 80 for Production/Domain Mapping
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
