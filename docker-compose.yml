services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexgensis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - backend_data:/app
    restart: unless-stopped
    networks:
      - nexgensis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexgensis-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nexgensis-network

volumes:
  backend_data:

networks:
  nexgensis-network:
    driver: bridge
